# Response headers the app must set itself (TLS and HSTS come from the ingress).
#
# nginx does not inherit add_header into a location that declares its own, so
# every location below that sets a header re-includes this file rather than
# silently dropping the set.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
