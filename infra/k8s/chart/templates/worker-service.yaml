{{- $component := "worker" -}}
{{/*
Headless: the worker has no callers, but Prometheus needs a Service to discover
and scrape the per-pod metrics endpoints.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "research-agent.fullname" . }}-{{ $component }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.worker.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "research-agent.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
