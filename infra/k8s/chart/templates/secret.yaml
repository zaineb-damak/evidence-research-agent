{{/*
Two secrets, because they have different owners.

`-connection` is always chart-owned: it holds values the chart *derives* —
the Postgres DSN and the Neo4j password — which depend on whether each store
runs in-cluster or is external. Deriving them here is what lets a workload stay
ignorant of that choice.

`-credentials` holds the things the chart cannot know: API keys and the JWT
secret. It is rendered only when secrets.create is true. Anywhere shared, set
secrets.create=false and point secrets.existingSecret at a Secret managed by
External Secrets / Sealed Secrets / SOPS — the connection secret keeps working
either way, so switching does not also mean hand-managing the DSN.

envFrom lists connection before credentials, so an operator-managed secret can
override a derived value if it ever needs to.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-agent.connectionSecretName" . }}
  labels:
    {{- include "research-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "research-agent.postgresDsn" . | quote }}
  NEO4J_PASSWORD: {{ include "research-agent.neo4jPassword" . | quote }}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "research-agent.credentialsSecretName" . }}
  labels:
    {{- include "research-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
