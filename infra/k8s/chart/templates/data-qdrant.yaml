{{- if .Values.qdrant.enabled }}
{{/*
Single-node Qdrant for development and staging. For production set
qdrant.enabled=false and point qdrant.externalUrl at Qdrant Cloud or a
distributed deployment. See values-prod.yaml.
*/}}
{{- $component := "qdrant" -}}
{{- $name := include "research-agent.qdrant.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.qdrant.service.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.qdrant.service.grpcPort }}
      targetPort: grpc
  selector:
    {{- include "research-agent.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "research-agent.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "research-agent.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "research-agent.componentLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.qdrant.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.qdrant.service.grpcPort }}
          # The image carries no shell utilities, so the probes are plain TCP
          # rather than an HTTP GET on /readyz.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
      {{- if not .Values.qdrant.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.qdrant.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.qdrant.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.qdrant.persistence.size }}
  {{- end }}
{{- end }}
