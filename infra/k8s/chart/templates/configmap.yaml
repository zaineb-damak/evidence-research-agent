{{/*
Non-secret settings. Keys match the environment variable names src/config.py
reads, so adding a setting there means adding one line here.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "research-agent.configMapName" . }}
  labels:
    {{- include "research-agent.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  SERVICE_NAME: {{ include "research-agent.name" . | quote }}
  RELEASE_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}

  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  WORKER_METRICS_PORT: {{ .Values.worker.metricsPort | quote }}
  READINESS_TIMEOUT_SECONDS: {{ .Values.config.readinessTimeoutSeconds | quote }}

  NEO4J_URI: {{ include "research-agent.neo4jUri" . | quote }}
  NEO4J_USER: {{ .Values.neo4j.auth.username | quote }}
  QDRANT_URL: {{ include "research-agent.qdrantUrl" . | quote }}
  QDRANT_COLLECTION: {{ .Values.config.qdrantCollection | quote }}
  REDIS_URL: {{ include "research-agent.redisUrl" . | quote }}

  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  LLM_MODEL: {{ .Values.config.llmModel | quote }}
  LLM_CACHE_BACKEND: {{ .Values.config.llmCacheBackend | quote }}
  LLM_REQUESTS_PER_SECOND: {{ .Values.config.llmRequestsPerSecond | quote }}
  LLM_STRUCTURED_RETRY_ATTEMPTS: {{ .Values.config.llmStructuredRetryAttempts | quote }}

  EMBED_PROVIDER: {{ .Values.config.embedProvider | quote }}
  EMBED_MODEL: {{ .Values.config.embedModel | quote }}
  EMBED_DIM: {{ .Values.config.embedDim | quote }}

  CHECKPOINT_THREAD_SCOPE: {{ .Values.config.checkpointThreadScope | quote }}
  CRAWLER_USER_AGENT: {{ .Values.config.crawlerUserAgent | quote }}
  LANGFUSE_HOST: {{ .Values.config.langfuseHost | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
