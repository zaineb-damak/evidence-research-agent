{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "research-agent.serviceAccountName" . }}
  labels:
    {{- include "research-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No workload here talks to the Kubernetes API, so the token is not mounted.
automountServiceAccountToken: false
{{- end }}
