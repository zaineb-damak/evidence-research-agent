name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE disclosed against untouched code still surfaces.
    - cron: "17 4 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the injection and auth query packs, which is
          # the point of running this on a service that executes model output
          # against retrieved web content.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs history; a shallow clone would only ever see the tip
          # commit and miss a secret added earlier in the branch.
          fetch-depth: 0

      # Free for personal and public repositories. An organization-owned repo
      # additionally needs GITLEAKS_LICENSE set as a secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan of the lockfiles: catches a vulnerable dependency before
      # it is ever baked into an image, which is where CI's image scan finds it.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .github/trivy/.trivyignore
