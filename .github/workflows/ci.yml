name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref supersedes this run; none of these gates are
# worth finishing twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Jobs that need more ask for it themselves.
permissions:
  contents: read

env:
  # requires-python is ">=3.12", so uv otherwise resolves the newest interpreter
  # it can find (3.14 today) and CI stops matching the 3.12 runtime image.
  UV_PYTHON: "3.12"
  NODE_VERSION: "22"
  # Accepted-vulnerability list, kept in .github so the repo root stays clean.
  TRIVY_IGNOREFILE: .github/trivy/.trivyignore

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen fails if uv.lock has drifted from pyproject.toml, which makes
      # an un-relocked dependency a CI error rather than a surprise at build time.
      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen ruff check src apps tests

      - name: Unit and integration tests
        run: uv run --frozen pytest tests -q

      # The evaluation gate runs on injected fakes here (no API keys in CI); the
      # runner is dependency-injected, so a scheduled job can run it live.
      - name: Evaluation gate
        run: uv run --frozen pytest tests/evaluation -q

      # Never blocking: this codebase has not been type-clean-gated before, and
      # turning mypy into a required check would wall off unrelated work.
      - name: Type check (advisory)
        continue-on-error: true
        run: uv run --frozen mypy src apps

  web:
    name: Web typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Catches build-only failures (bad imports, Vite config) that vitest and
      # tsc both miss.
      - name: Build
        run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint infra/k8s/chart
          helm lint infra/k8s/chart --values infra/k8s/chart/values-staging.yaml
          helm lint infra/k8s/chart --values infra/k8s/chart/values-prod.yaml

      # lint accepts templates that fail to render; `template` is what actually
      # proves the manifests are valid YAML for every environment.
      - name: Render manifests
        run: |
          helm template research-agent infra/k8s/chart > /dev/null
          helm template research-agent infra/k8s/chart \
            --values infra/k8s/chart/values-staging.yaml > /dev/null
          helm template research-agent infra/k8s/chart \
            --values infra/k8s/chart/values-prod.yaml > /dev/null

  dockerfiles:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/docker/python.Dockerfile
          - infra/docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .github/hadolint.yaml

  images:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/python.Dockerfile
            target: api
          - image: worker
            dockerfile: infra/docker/python.Dockerfile
            target: worker
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # amd64 only here. Multi-arch is a release concern; emulating arm64 on a
      # CI runner roughly triples the build for no extra signal.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: research-agent-${{ matrix.image }}:ci
          build-args: RELEASE_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # ignore-unfixed: an upstream CVE with no released patch cannot be acted
      # on, and blocking on it only trains people to bypass the gate. Findings
      # that are fixable and accepted anyway go in .github/trivy/.trivyignore
      # with a reason and a date.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: research-agent-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          trivyignores: ${{ env.TRIVY_IGNOREFILE }}
